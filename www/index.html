<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c1318">
<title>FreeCell</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="shade" aria-hidden="true"></div>
<div id="app">
  <header id="hud">
    <button id="gameBtn" class="hud-item" aria-label="Choose deal number">
      <span class="hud-label">Deal</span><span class="hud-val" id="gameNo">#1</span>
    </button>
    <div class="hud-item mid"><span class="hud-label">Time</span><span class="hud-val" id="time">0:00</span></div>
    <div class="hud-item end"><span class="hud-label">Moves</span><span class="hud-val" id="moves">0</span></div>
  </header>
  <main id="board"><div id="toast" role="status" aria-live="polite"></div></main>
  <nav id="toolbar" aria-label="Game controls">
    <button id="btnNew" aria-label="New game">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="15" rx="2"/><path d="M9 21h8a3 3 0 0 0 3-3V8"/><path d="M9.5 8v5M7 10.5h5"/></svg><span>New</span>
    </button>
    <button id="btnUndo" aria-label="Undo">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span>
    </button>
    <button id="btnHint" aria-label="Hint">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5 1 1.1 1 1.9v.3h5.6v-.3c0-.8.4-1.4 1-1.9A6.5 6.5 0 0 0 12 2.5Z"/></svg><span>Hint</span>
    </button>
    <button id="btnStats" aria-label="Statistics">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-9"/></svg><span>Stats</span>
    </button>
    <button id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h5M13 12h7"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/><circle cx="11" cy="12" r="2"/></svg><span>Settings</span>
    </button>
  </nav>
</div>
<script src="js/capacitor.js"></script>
<script src="js/version.js"></script>
<script src="js/rules.js"></script>
<script src="js/cards.js"></script>
<script src="js/solver.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
